    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icon-144.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Autexa" />
    <title>Autexa — программа для автосервиса: касса, склад, зарплата, клиенты</title>
    <meta
      name="description"
      content="Autexa — приложение для автосервиса: касса и заказ-наряды, склад, зарплата, клиенты и авто. Работает на iPhone, Android и в браузере; на телефоне — даже офлайн."
    />
    <meta property="og:title" content="Autexa — программа для автосервиса: касса, склад, зарплата, клиенты" />
    <meta
      property="og:description"
      content="Касса и заказ-наряды, склад, зарплата, клиенты и авто в одном приложении. Работает на iPhone, Android и в браузере; на телефоне — даже офлайн."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Autexa" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA auto-update: без этого новый деплой не виден, пока пользователь
      // вручную не сделает хард-рефреш (а в установленном iOS-PWA — почти
      // никогда). SW зовёт skipWaiting()+clients.claim() при install/activate,
      // поэтому свежий sw.js сам станет controller'ом и выстрелит
      // 'controllerchange' — мы на нём перезагружаем страницу РОВНО один раз.
      if ('serviceWorker' in navigator) {
        var refreshing = false;
        // Снимаем наличие controller'а НА МОМЕНТ ЗАГРУЗКИ: при самой первой
        // установке SW тоже вызывает clients.claim() → 'controllerchange'
        // прилетает на свежей странице, и перезагружать её НЕ нужно.
        var hadControllerAtLoad = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          if (!hadControllerAtLoad) return; // первый SW на чистой странице — без reload
          refreshing = true;
          window.location.reload();
        });
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              reg.update().catch(function () {}); // проверить обновление сразу
              setInterval(function () {
                reg.update().catch(function () {});
              }, 60000); // и периодически
            })
            .catch(function () {});
        });
        // Доп. проверка при возврате фокуса/резюме — закрывает кейс
        // установленного iOS-PWA, который «оживает» из снапшота.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then(function (r) {
              if (r) r.update().catch(function () {});
            });
          }
        });
      }
    </script>
  </body>
</html>
