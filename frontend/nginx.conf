# ═══════════════════════════════════════════════════════════════════════════════
#  Autexa PWA — Nginx Configuration (Maximum Performance)
# ═══════════════════════════════════════════════════════════════════════════════

upstream backend_pool {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression (high performance) ───────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2
        application/wasm;

    # ── Client-side performance ────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ── Open file cache (reduces disk I/O) ─────────────────────────────────
    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Скачивание APK — отдаём файл напрямую ──────────────────────────
    location ^~ /download/ {
        alias /app/downloads/;
        access_log off;
        # Браузер скачает файл, а не откроет
        add_header Content-Disposition "attachment";
        add_header Content-Type "application/vnd.android.package-archive";
    }

    # ── Serve uploaded files directly from disk ────────────────────────────
    location ^~ /api/uploads/ {
        alias /app/uploads/;
        access_log off;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";
    }

    # ── API proxy with keep-alive ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_pool/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_pass_header ETag;
        proxy_pass_header Cache-Control;

        client_max_body_size 10M;
    }

    # ── Service Worker — NEVER cache ───────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Web App Manifest — short cache ─────────────────────────────────────
    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
    }

    # ── JS/CSS with content hash — immutable long-cache ────────────────────
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Fonts — immutable long-cache ───────────────────────────────────────
    location ~* \.(?:woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # ── Images — long cache ────────────────────────────────────────────────
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── SPA fallback — HTML shell never cached ─────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
