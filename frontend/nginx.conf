# ═══════════════════════════════════════════════════════════════════════════════
#  Autexa PWA — Nginx Configuration (Performance Optimized)
# ═══════════════════════════════════════════════════════════════════════════════

# Upstream: keep-alive connection pool to backend (reduces TCP handshakes)
upstream backend_pool {
    server backend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ─────────────────────────────────────────────────────
    # Reduces transfer size by 60-80% for text-based responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ── Client-side performance ──────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ── Open file cache (reduces disk I/O for static files) ──────────────────
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ── Serve uploaded files directly from disk ──────────────────────────────
    location ^~ /api/uploads/ {
        alias /app/uploads/;
        access_log off;
        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept";

        # WebP content negotiation
        location ~* \.webp$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Type "image/webp";
        }
    }

    # ── API proxy with keep-alive connection pool ────────────────────────────
    location /api/ {
        proxy_pass http://backend_pool/api/;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # HTTP/1.1 keep-alive to backend
        proxy_http_version 1.1;

        # Timeouts
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        # Buffers (reduce latency for small responses)
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Forward ETag headers for 304 Not Modified support
        proxy_pass_header ETag;
        proxy_pass_header Cache-Control;

        client_max_body_size 10M;
    }

    # ── Service Worker — never cache ─────────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ── Web App Manifest — short cache ───────────────────────────────────────
    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Static assets with content hash — immutable long-cache ───────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback — HTML shell never cached ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
