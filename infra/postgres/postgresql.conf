# ═════════════════════════════════════════════════════════════════════════
#  PostgreSQL 16 tuned config for Autexa
# ═════════════════════════════════════════════════════════════════════════
#  Target host: ~6 GB RAM, 4 CPU cores, NVMe SSD, single-instance.
#  The base postgres:16-alpine image ships with default values written for
#  modest 128 MB containers — this config unlocks 5-10x throughput on the
#  same hardware.
#
#  Generated from pgtune.leopard.in.ua presets (Web app + ~6GB) and refined
#  for our workload: many small SELECTs (lists, dashboards), occasional bulk
#  imports, no heavy analytics.
#
#  Mount via docker-compose:
#    volumes:
#      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
#    command: ['postgres', '-c', 'config_file=/etc/postgresql/postgresql.conf']
# ═════════════════════════════════════════════════════════════════════════

# ── Connections ─────────────────────────────────────────────────────────
listen_addresses = '*'
max_connections = 100
# Pre-fork backends idle; cheap on memory.
superuser_reserved_connections = 3

# ── Memory ──────────────────────────────────────────────────────────────
# 25% of RAM — Postgres uses this for shared page cache.
shared_buffers = 1536MB
# OS file-cache hint: how much memory the kernel keeps for postgres files.
# 75% of RAM is the standard recommendation.
effective_cache_size = 4608MB
# Per-operation sort / hash memory. With max_connections=100, max RAM used
# by parallel sorts is ~ work_mem * max_connections = 1.6GB at peak.
work_mem = 16MB
# VACUUM / CREATE INDEX / ALTER TABLE memory.
maintenance_work_mem = 256MB

# ── Disk / NVMe optimization ────────────────────────────────────────────
# NVMe has ~equal seq and random read cost; default 4.0 vs 1.0 makes the
# planner avoid index scans needlessly. 1.1 = "indexes are ~free".
random_page_cost = 1.1
# How many concurrent reads the storage can serve. NVMe handles many.
effective_io_concurrency = 200

# ── WAL (write-ahead log) ───────────────────────────────────────────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9
# Reduce I/O spikes by spreading checkpoint writes.
max_wal_size = 2GB
min_wal_size = 256MB
# Compress WAL — saves disk / I/O at marginal CPU cost.
wal_compression = on

# ── Parallel queries ────────────────────────────────────────────────────
# 4 CPU cores → up to 4 parallel workers per query.
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ── Autovacuum (keep stats fresh on growing tables) ─────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# ── Logging — only warnings & slow queries ──────────────────────────────
log_min_duration_statement = 500ms
log_line_prefix = '%t [%p]: '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s

# ── Time / locale (kept system-wide, but explicit for predictability) ──
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'

# ── Locks ───────────────────────────────────────────────────────────────
deadlock_timeout = 1s
lock_timeout = 30s
statement_timeout = 0   # no global cap; per-session apps set their own
idle_in_transaction_session_timeout = 60s

# ── Misc tuning ─────────────────────────────────────────────────────────
default_statistics_target = 100
jit = off   # JIT planning often hurts small OLTP queries; turn on later if heavy aggregations appear
