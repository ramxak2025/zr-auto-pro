name: Auto Deploy

on:
  push:
    branches:
      - claude/redesign-from-scratch-5xQJz
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          echo "Triggering deploy on server..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            "${{ secrets.DEPLOY_URL }}/deploy" \
            --max-time 30)

          echo "Response code: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "Deploy triggered successfully!"
          elif [ "$RESPONSE" = "409" ]; then
            echo "Deploy already in progress, skipping"
          else
            echo "Deploy trigger failed with code $RESPONSE"
            exit 1
          fi
