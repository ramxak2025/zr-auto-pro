services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: /ensure-password.sh
    environment:
      POSTGRES_DB: zr_auto_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/ensure-password.sh:/ensure-password.sh:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@postgres:5432/zr_auto_pro?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8080:80'

  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_SECRET: ${DEPLOY_SECRET:-zr-auto-deploy-secret-change-me}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-claude/redesign-from-scratch-5xQJz}
      WEBHOOK_PORT: '9000'
    ports:
      - '9000:9000'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy/repo
      - ./deploy.sh:/deploy/deploy.sh:ro
    working_dir: /deploy/repo

volumes:
  pgdata:
  uploads:
