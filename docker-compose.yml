services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Потолок памяти (resilience): один контейнер не может съесть весь VDS.
    # ВАЖНО: НЕ ставить 1g — shared_buffers в infra/postgres/postgresql.conf
    # равен 1536MB, под лимитом 1g постгрес не стартует / уходит в OOM-kill.
    # 3g = shm 1.5g + connections/work_mem + page-cache (последний reclaimable).
    mem_limit: 3g
    environment:
      POSTGRES_DB: zr_auto_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Tuned postgres config (see infra/postgres/postgresql.conf for rationale).
      # Mounted read-only and pointed at via -c config_file=. Falls back to the
      # image default if this file is missing or unreadable.
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis — token-revocation blacklist / rate-limit backing store ────────
  # Internal-only (expose, NOT ports) — never published to the host.
  # Persistence via appendonly so revoked tokens survive a restart.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── backend — primary replica (LEADER for background jobs) ───────────────
  # Two identical backend replicas (backend + backend2) sit behind the nginx
  # upstream so a rolling deploy never drops /api (zero-downtime). This one is
  # the LEADER: RUN_BACKGROUND_JOBS=true → cron/interval jobs (reminders,
  # analytics, shift auto-close) run ONLY here. backend2 is HTTP-only.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Единое имя образа для ОБОИХ режимов деплоя (см. deploy.sh):
    #  • локальная сборка (по умолчанию): `compose build` тегает собранный образ
    #    этим именем, а backend2 (без build-секции) переиспользует его
    #    byte-for-byte — вторая сборка не нужна;
    #  • pull-режим (GHCR_READ_TOKEN в серверном .env): `compose pull` тянет
    #    ЭТОТ ЖЕ тег из GHCR — его публикует .github/workflows/build-images.yml.
    image: ghcr.io/ramxak2025/autexa-backend:latest
    restart: unless-stopped
    # Дать NestJS время слить запросы «в полёте» при деплое (graceful shutdown
    # через app.enableShutdownHooks) до того как Docker пришлёт SIGKILL —
    # это убирает 504 на запросе «в полёте» во время --force-recreate.
    stop_grace_period: 30s
    # Потолок памяти (ceiling, не reservation): обычный RSS ~250МБ, лимит лишь
    # страхует VDS от разгона утечки. Симметрично backend2 (см. ниже).
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      # Intentionally service_started (NOT service_healthy): backend must boot
      # even if redis is slow/unhealthy. The redis client falls back to an
      # in-memory blacklist, so a redis outage degrades gracefully, not fatally.
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/zr_auto_pro?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      # LEADER: фоновые джобы (напоминания, аналитика, авто-закрытие смен)
      # выполняются ТОЛЬКО на этой реплике. На backend2 — "false".
      RUN_BACKGROUND_JOBS: "true"
      # Server-side Sentry: пусто = выключен (backend/src/common/sentry.ts).
      # Раньше переменная не пробрасывалась вовсе — Sentry молча не работал.
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── backend2 — second replica (HTTP-only, NOT the job leader) ────────────
  # Reuses the exact image built/pulled for `backend` (same tag, no second
  # build and no separate pull). Exists purely so nginx always has ≥1 live
  # upstream during a rolling deploy. Background jobs are DISABLED here
  # (RUN_BACKGROUND_JOBS=false) so reminders / analytics / shift auto-close /
  # review-SMS fire exactly once across the two replicas.
  backend2:
    image: ghcr.io/ramxak2025/autexa-backend:latest
    restart: unless-stopped
    stop_grace_period: 30s
    # Потолок памяти для ОПЦИОНАЛЬНОЙ реплики: если RAM на VDS окажется тесным,
    # backend2 упрётся в СВОЙ cgroup-лимит и его убьёт первым — kernel НЕ выберет
    # жертвой postgres. Это ceiling (не reservation): обычный RSS ~250МБ, лимит
    # лишь ограничивает разгон. У основного `backend` такой же потолок 1g.
    # nginx-фейловер означает: даже если backend2 не поднимется — /api жив на backend.
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/zr_auto_pro?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      REDIS_URL: redis://redis:6379
      PORT: 3000
      RUN_BACKGROUND_JOBS: "false"
      # Server-side Sentry: пусто = выключен (backend/src/common/sentry.ts).
      SENTRY_DSN: ${SENTRY_DSN:-}
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    # Тот же принцип, что у backend: локальная сборка тегает образ этим именем,
    # pull-режим (GHCR_READ_TOKEN) тянет готовый из GHCR (build-images.yml).
    image: ghcr.io/ramxak2025/autexa-frontend:latest
    restart: unless-stopped
    depends_on:
      # Wait for the LEADER to be truly healthy; backend2 only needs to be
      # started so nginx can resolve its hostname in the static upstream.
      backend:
        condition: service_healthy
      backend2:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - uploads:/app/uploads:ro
      - ./downloads:/app/downloads:ro
    healthcheck:
      # nginx:alpine → busybox wget доступен. Проверяем, что nginx реально
      # отдаёт контент на / (listen 80), а не просто «процесс жив».
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_SECRET: ${DEPLOY_SECRET:?DEPLOY_SECRET must be set in .env}
      DEPLOY_BRANCH: ${DEPLOY_BRANCH:-refactor/full-audit-2026}
      WEBHOOK_PORT: "9000"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy/repo
      - ./deploy.sh:/deploy/deploy.sh:ro
    working_dir: /deploy/repo

volumes:
  pgdata:
  uploads:
  redisdata:
